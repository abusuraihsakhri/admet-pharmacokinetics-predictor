[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admet-pharmacokinetics-predictor"
version = "2.0.0"
description = "ADMET & Pharmacokinetics Predictor: Lipinski/Veber/Egan/Ghose/Muegge filters, QED, CNS MPO, ADMET profiling, and PK simulation"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
admet-predictor = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/admet-pharmacokinetics-predictor"
Repository = "https://github.com/abusuraihsakhri/admet-pharmacokinetics-predictor.git"
