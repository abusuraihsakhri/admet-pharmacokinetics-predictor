[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admet-pharmacokinetics-predictor"
version = "2.1.0"
description = "Descriptor-based drug-likeness screening, heuristic ADMET estimates, CNS MPO scoring, and pharmacokinetic simulation"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
admet-predictor = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/admet-pharmacokinetics-predictor"
Repository = "https://github.com/abusuraihsakhri/admet-pharmacokinetics-predictor.git"
